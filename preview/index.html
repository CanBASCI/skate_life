<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>skate_life — editor</title>
    <link rel="stylesheet" href="./style.css?v=20251113prompt10" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="layout">
      <aside id="palette-left" class="palette">
        <header>
          <h1>Objects</h1>
          <input id="obj-filter" type="search" placeholder="Ara…" autocomplete="off" />
        </header>
        <div id="obj-cats" class="palette-body"></div>
      </aside>

      <main id="stage">
        <div id="hud">
          <span><kbd>WASD</kbd> hareket · <kbd>Shift</kbd> koş · <kbd>Space</kbd> zıpla/vault · <kbd>H</kbd> dans · <kbd>E</kbd> araç/kaykay · <kbd>P</kbd> pet · <kbd>Q</kbd> yön · yol: <kbd>Shift</kbd>+<kbd>←→↑↓</kbd> uç uca · <kbd>Ctrl+Z</kbd> geri al</span>
          <span id="status">Yükleniyor…</span>
        </div>
        <div id="view-controls">
          <div id="viewport-toggle" title="Oyun alanı oranı">
            <button type="button" data-vp="fill" class="active">Varsayılan</button>
            <button type="button" data-vp="9x16">9:16</button>
          </div>
          <div id="bg-toggle" title="Oyun alanı arka planı">
            <button type="button" data-bg="grass" class="active">Yeşil</button>
            <button type="button" data-bg="black">Lacivert</button>
          </div>
          <div id="col-toggle" title="Karakter / pet collision alanı">
            <button type="button" data-col="show" class="active">Col göster</button>
            <button type="button" data-col="hide">Col gizle</button>
          </div>
          <div id="scene-toggle" title="9:16 sahne düzeni JSON">
            <button type="button" id="scene-copy">JSON kopyala</button>
            <button type="button" id="scene-load">JSON yapıştır</button>
            <button type="button" id="scene-clear">Sahne sil</button>
          </div>
          <div id="scene-slots" title="Kayıtlı sahneler — tıkla yükle"></div>
        </div>
        <div id="scene-modal" class="hidden" aria-hidden="true">
          <div class="scene-modal-card">
            <h2>Sahne JSON</h2>
            <p>Yapıştırıp yükle — refresh’te localStorage’dan da açılır.</p>
            <textarea id="scene-json" rows="14" spellcheck="false" placeholder='{ "version": 1, ... }'></textarea>
            <div class="scene-modal-actions">
              <button type="button" id="scene-modal-cancel">İptal</button>
              <button type="button" id="scene-modal-apply">Yükle</button>
            </div>
          </div>
        </div>
        <div id="app"></div>
        <div id="inspector" class="hidden">
          <div class="insp-title" id="insp-label" title="Sürükleyerek istediğin yere taşı">—</div>
          <label>X <input id="insp-x" type="number" step="1" /></label>
          <label>Z <input id="insp-z" type="number" step="1" /></label>
          <label>Boyut <input id="insp-scale" type="range" min="0.25" max="4" step="0.05" /><span id="insp-scale-val">1.00</span></label>
          <div class="dirs" id="insp-dirs" title="Yön"></div>
          <button type="button" id="insp-dance" class="insp-dance hidden" title="Dans animasyonu">Dans: Kapalı</button>
          <div id="insp-col" class="insp-col hidden" title="İçinde yürünebilir alan — köşeleri sürükleyerek ayarla">
            <label class="insp-check"><input id="insp-col-on" type="checkbox" /> İç alan</label>
            <span class="insp-col-hint">Köşe sürükle · kenar ortası = nokta ekle · Alt+tık = sil</span>
            <button type="button" id="insp-col-reset" class="insp-col-reset">Kareyi sıfırla</button>
          </div>
          <button type="button" id="insp-delete" class="danger">Sil</button>
        </div>
        <div id="chat-bar">
          <input id="chat-input" type="text" maxlength="48" autocomplete="off" placeholder="Mesaj veya /R3 /dance /jump /sit /e /stop…" />
          <button type="button" id="chat-send">Gönder</button>
        </div>
      </main>

      <aside id="palette-right" class="palette">
        <header>
          <h1>Characters</h1>
          <input id="char-filter" type="search" placeholder="Ara…" autocomplete="off" />
        </header>
        <div id="char-cats" class="palette-body"></div>
      </aside>
    </div>

    <!-- fixed overlay: always above WebGL canvas / sprites -->
    <div id="prompt" class="hidden"><kbd id="prompt-key">/E</kbd> <span id="prompt-text">bin</span></div>
    <div id="stamina" class="hidden"><div id="stamina-fill"></div></div>
    <div id="drag-ghost" class="hidden"></div>
    <div id="world-labels"></div>
    <script type="module" src="./main.js?v=20251113namePad3"></script>
  </body>
</html>
