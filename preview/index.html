<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>skate_life — editor</title>
    <link rel="stylesheet" href="./style.css?v=20251113stamina" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="layout">
      <aside id="palette-left" class="palette">
        <header>
          <h1>Objects</h1>
          <input id="obj-filter" type="search" placeholder="Ara…" autocomplete="off" />
        </header>
        <div id="obj-cats" class="palette-body"></div>
      </aside>

      <main id="stage">
        <div id="hud">
          <span><kbd>WASD</kbd> hareket · <kbd>Shift</kbd> koş · <kbd>Space</kbd> zıpla/vault · <kbd>H</kbd> dans · <kbd>E</kbd> araç/kaykay · <kbd>P</kbd> pet · <kbd>Q</kbd> yön · yol: <kbd>Shift</kbd>+<kbd>←→↑↓</kbd> uç uca · <kbd>Ctrl+Z</kbd> geri al</span>
          <span id="status">Yükleniyor…</span>
        </div>
        <div id="app"></div>
        <div id="inspector" class="hidden">
          <div class="insp-title" id="insp-label">—</div>
          <label>X <input id="insp-x" type="number" step="1" /></label>
          <label>Z <input id="insp-z" type="number" step="1" /></label>
          <label>Boyut <input id="insp-scale" type="range" min="0.25" max="4" step="0.05" /><span id="insp-scale-val">1.00</span></label>
          <div class="dirs" id="insp-dirs" title="Yön"></div>
          <button type="button" id="insp-delete" class="danger">Sil</button>
        </div>
      </main>

      <aside id="palette-right" class="palette">
        <header>
          <h1>Characters</h1>
          <input id="char-filter" type="search" placeholder="Ara…" autocomplete="off" />
        </header>
        <div id="char-cats" class="palette-body"></div>
      </aside>
    </div>

    <!-- fixed overlay: always above WebGL canvas / sprites -->
    <div id="prompt" class="hidden"><kbd>E</kbd> <span id="prompt-text">Bin</span></div>
    <div id="stamina" class="hidden"><div id="stamina-fill"></div></div>
    <div id="drag-ghost" class="hidden"></div>
    <script type="module" src="./main.js?v=20251113roadScale4"></script>
  </body>
</html>
