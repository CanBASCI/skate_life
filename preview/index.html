<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skate_life — pixel scale preview</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <h1>Pixel scale yard</h1>
        <p>
          Top-down. Characters/vehicles at native px; <span class="scale">buildings ×1.85</span> (PixelLab max 256 — we scale in-scene).
        </p>
        <p>
          <kbd>drag asset</kbd> move · <kbd>drag empty</kbd> pan · <kbd>scroll</kbd> zoom · lower on screen = in front
        </p>
        <div id="selected">Click any asset…</div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
